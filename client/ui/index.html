<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>G醫t</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>G醫t <span>更新の通知</span></h1>
    <p id="status" class="muted"></p>
  </header>

  <section>
    <h2>最近の更新</h2>
    <p id="recentEmpty" class="muted">通知した更新が、ここに並びます（クリックで差分を開きます）。</p>
    <ul id="recent" class="sites"></ul>
  </section>

  <section>
    <h2>通知を受け取るサイト</h2>
    <div class="row">
      <input id="filter" type="search" placeholder="サイト名・ドメインで絞り込む" aria-label="サイトの絞り込み" />
      <label class="chk"><input id="only" type="checkbox" /> フォロー中のみ</label>
      <span id="count" class="muted"></span>
    </div>
    <ul id="sites" class="sites"></ul>
  </section>

  <section>
    <h2>ブラウザの☆から取り込む</h2>
    <p class="muted">ダッシュボードの「🔗 フォロー設定を共有」で作った URL（または slug をカンマ区切りで）を貼り付けると、今の選択に足されます。</p>
    <div class="row">
      <input id="import" type="text" placeholder="https://…/?follow=a,b,c" aria-label="共有 URL" />
      <button id="importBtn" type="button">取り込む</button>
    </div>
  </section>

  <section>
    <h2>設定</h2>
    <div class="grid">
      <label for="baseUrl">ダッシュボードの URL</label>
      <input id="baseUrl" type="url" />
      <label for="interval">確認の間隔（分）</label>
      <input id="interval" type="number" min="5" max="240" step="5" />
      <label for="login" id="loginLabel">ログイン時に起動</label>
      <input id="login" type="checkbox" />
    </div>
    <div class="row">
      <button id="saveBtn" type="button">設定を保存</button>
      <button id="checkBtn" type="button">今すぐ確認</button>
      <button id="testBtn" type="button">通知のテスト</button>
    </div>
    <p id="msg" class="muted" role="status"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
