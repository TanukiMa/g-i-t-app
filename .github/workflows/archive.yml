name: Run G-I-T Archive Worker

on:
  schedule:
    # Three runs a day, each about 50 minutes after a stalk run of the planned schedule (JST 7:30, 12:30, 16:30;
    # Cloud Scheduler runs it once the pipeline has moved to Cloud Run, stalk.yml is then retired), so that the pages
    # found are saved soon after: JST 8:20, 13:20, 17:20 = UTC 23:20 (the day before), 04:20, 08:20. Off-peak minutes
    # (GitHub is busiest at :00/:15/:30/:45). Each run works for up to ARCHIVE_RUNTIME_MIN minutes: with
    # ARCHIVE_WORKERS=3 about 5 URLs a minute (one at a time it was about 80 an hour).
    - cron: '20 23,4,8 * * *'
  workflow_dispatch:

# Only touches Supabase and the Internet Archive, so it never conflicts with stalk.yml.
concurrency:
  group: git-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Drain archive queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # More keys (optional): used one after the other, when the one before is rate limited. Unset secrets are empty.
          IA_ACCESS_KEY_2: ${{ secrets.IA_ACCESS_KEY_2 }}
          IA_SECRET_KEY_2: ${{ secrets.IA_SECRET_KEY_2 }}
          IA_ACCESS_KEY_3: ${{ secrets.IA_ACCESS_KEY_3 }}
          IA_SECRET_KEY_3: ${{ secrets.IA_SECRET_KEY_3 }}
          ARCHIVE_BATCH_SIZE: '20'
          # A capture takes 20-40 s: 3 at a time, a new one at most every 10 s (6 a minute; the Internet Archive allows 7 per
          # account). One at a time used only a fifth of that (about 80 URLs an hour).
          ARCHIVE_WORKERS: '3'
          ARCHIVE_INTERVAL_SEC: '10'
          ARCHIVE_RUNTIME_MIN: '60'
          PYTHONUNBUFFERED: '1'
        run: python scripts/archive_worker.py
