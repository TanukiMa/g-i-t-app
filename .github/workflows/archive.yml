name: Run G-I-T Archive Worker

on:
  schedule:
    # GitHub fires frequent schedules only a few times a day (and is busiest at :00/:15/:30/:45), so use
    # off-peak minutes; each run keeps working for up to ARCHIVE_RUNTIME_MIN minutes instead of a fixed count.
    - cron: '7,37 * * * *'
  workflow_dispatch:

# Only touches Supabase and the Internet Archive, so it never conflicts with stalk.yml.
concurrency:
  group: git-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Drain archive queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ARCHIVE_BATCH_SIZE: '20'
          ARCHIVE_INTERVAL_SEC: '15'
          ARCHIVE_RUNTIME_MIN: '14'
        run: python scripts/archive_worker.py
