name: Build G醫t client (unsigned)

# Manual only. UNTESTED on GitHub's runners: the Windows build and `cargo test -p git_core` were run locally;
# the macOS / Android / iOS-simulator jobs follow the Tauri 2 documentation. Signing certificates / keystores are not set up.
on:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client }
      - run: cargo test -p git_core

  desktop:
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client }
      - run: npm install
        working-directory: client
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: client
          uploadWorkflowArtifacts: true

  # Android builds on Linux: the Android SDK is installed there too, and Linux minutes are the cheapest (the Windows runner
  # has no advantage). The project files are generated here (`tauri android init`); commit them once the app is stable.
  android:
    needs: core-tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client }
      - run: npm install
      - run: npx tauri android init
      - run: npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: g-i-t-client-android-apk
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # iOS / iPadOS: macOS runner only. A simulator build needs no signing; a device build needs an Apple Developer account.
  # What is built here can be started in a simulator (`xcrun simctl`), but a CI runner has no screen to watch.
  ios-simulator:
    needs: core-tests
    runs-on: macos-latest
    continue-on-error: true
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios-sim }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client }
      - run: npm install
      - run: npx tauri ios init
      - run: npx tauri ios build --debug --target aarch64-sim
