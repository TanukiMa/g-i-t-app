name: Run G-I-T Stalker Pipeline

on:
  schedule:
    - cron: '31 3,7,13,22 * * *'
  workflow_dispatch:

concurrency:
  group: git-stalker
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          path: app

      - name: Checkout Data Repository
        uses: actions/checkout@v7
        with:
          repository: 'TanukiMa/g-i-t-data'
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          path: data

      - name: Setup Node.js (for diff2html)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install diff2html-cli
        run: npm install -g diff2html-cli

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Rebuild only when the fork changes: the cache key is its current HEAD commit.
      - name: Resolve website-stalker revision
        id: ws
        run: echo "sha=$(git ls-remote https://github.com/TanukiMa/website-stalker.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache website-stalker binary
        id: ws-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/website-stalker
          key: website-stalker-${{ runner.os }}-${{ steps.ws.outputs.sha }}

      - name: Install website-stalker
        if: steps.ws-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/TanukiMa/website-stalker.git --rev ${{ steps.ws.outputs.sha }}

      - name: Install Dependencies
        run: pip install -r app/requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "g-i-t-bot"
          git config --global user.email "g-i-t-bot@users.noreply.github.com"
          git config --global core.quotepath false

      - name: Execute Pipeline
        env:
          # Optional access analytics (repository variables; empty = no tag is added to the pages)
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional (repository variables / secret; empty = defaults, see docs): model order and a second provider
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          LLM_FALLBACK_URL: ${{ vars.LLM_FALLBACK_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_FALLBACK_KEY: ${{ secrets.LLM_FALLBACK_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Contact address sent as the HTTP From header (required by website-stalker)
          WEBSITE_STALKER_FROM: ${{ secrets.WEBSITE_STALKER_FROM }}
          # Show the log while the run is going; stop starting new work after ~32 min of the 60 min limit
          PYTHONUNBUFFERED: '1'
          STALK_BUDGET_MIN: '40'
        run: |
          python app/scripts/website_stalk.py --data-dir ./data

      # GitHub recommends repositories stay under ~1 GB; warn well before that.
      - name: Report repository size
        if: always()
        run: |
          git -C data gc --quiet || true
          size_mb=$(du -sm data/.git | cut -f1)
          echo "g-i-t-data .git size: ${size_mb} MB"
          if [ "$size_mb" -gt 700 ]; then
            echo "::warning::g-i-t-data is ${size_mb} MB (GitHub recommends < 1 GB). Reduce snapshot noise via editors or rotate the repository."
          fi

      - name: Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: TanukiMa/g-i-t-data
          publish_branch: gh-pages
          publish_dir: ./data/public
          # Keep gh-pages at a single commit; the history already lives on main.
          force_orphan: true
