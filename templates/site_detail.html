{% from "_macros.html" import nav, entry, footer %}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ site_slug }} - G医t</title>
<link rel="stylesheet" href="../../assets/github.css" />
</head>
<body>
<main>
  {{ nav('', '../../') }}
  <header>
    <h1>{{ site_slug }}</h1>
    <p id="status">生成: {{ generated }}</p>
  </header>
  <a class="page-back" href="../../index.html">← 全体タイムラインへ戻る</a>
  <div id="content">
    {% for item in updates %}
    {{ entry(item, '') }}
    {% else %}
    <p>このサイトの更新履歴はまだありません。</p>
    {% endfor %}
  </div>
  {{ footer() }}
</main>
</body>
</html>
