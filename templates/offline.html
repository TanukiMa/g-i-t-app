<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>オフラインです - G医t</title>
<style>
  /* Self-contained: this page is served for ANY address while offline, so relative links would break. */
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; --link: #0969da; --border: #d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --link: #58a6ff; --border: #30363d; } }
  body { background: var(--bg); color: var(--fg); margin: 0; padding: 3rem 16px;
         font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.8; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: var(--muted); }
  a { color: var(--link); }
  .box { border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>インターネットに接続できません</h1>
  <p>このページは、まだこの端末に保存されていません。接続が戻ってから、もう一度開いてください。</p>
  <div class="box">
    <p style="margin:0">最近開いたページは、オフラインでも表示できます。</p>
    <p style="margin:.5rem 0 0"><a id="home" href="#">最新のタイムラインへ（保存されていれば表示します）</a></p>
  </div>
  <script>
    // Resolve the link against the service worker's scope: this document is shown at an arbitrary address.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) document.getElementById("home").href = reg.scope;
      });
    }
  </script>
</main>
</body>
</html>
