{% from "_macros.html" import nav, entry, footer, status %}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>G医t</title>
<link rel="stylesheet" href="assets/github.css" />
</head>
<body>
<main>
  {{ nav('index') }}
  <header>
    <h1>G医t</h1>
    {{ status(generated, sites) }}
  </header>
  <div id="content">
    {% for item in updates %}
    {{ entry(item, 'sites/' ~ item.site_slug ~ '/') }}
    {% else %}
    <p>更新履歴はまだありません。</p>
    {% endfor %}
  </div>
  {{ footer() }}
</main>
</body>
</html>
